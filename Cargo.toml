[package]
name = "husk"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "CalDAV tasks in the terminal, synced with Apple Reminders and Tasks.org"
license = "MIT OR Apache-2.0"
repository = "https://github.com/czepluch/husk"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
iana-time-zone = "0.1.65"
notify = "8.2.0"
notify-rust = "4.18.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
unicode-width = "0.2.2"
uuid = { version = "1.26.0", features = ["v4"] }

[profile.release]
strip = true
